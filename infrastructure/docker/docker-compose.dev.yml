version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ares-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ares
      POSTGRES_PASSWORD: ares
      POSTGRES_DB: ares_dev
    volumes:
      - ares_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ares']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ares-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ares_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ares_pgdata:
  ares_redis:
