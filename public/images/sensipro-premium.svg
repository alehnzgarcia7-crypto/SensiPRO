<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="fire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ee0979"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <!-- Border glow -->
  <rect x="2" y="2" width="396" height="396" rx="20" fill="none" stroke="url(#fire2)" stroke-width="2" opacity="0.4"/>
  <!-- Icon -->
  <text x="200" y="140" font-family="Arial" font-size="60" text-anchor="middle">⚡</text>
  <!-- Title -->
  <text x="200" y="210" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="36" fill="white" text-anchor="middle">SensiPRO</text>
  <!-- Premium badge -->
  <rect x="130" y="230" width="140" height="32" rx="16" fill="url(#fire2)" opacity="0.9"/>
  <text x="200" y="252" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="15" fill="white" text-anchor="middle">PREMIUM</text>
  <!-- Subtitle -->
  <text x="200" y="310" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" text-anchor="middle">Acceso de por vida</text>
  <!-- Bottom text -->
  <text x="200" y="360" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="14" fill="#64748b" text-anchor="middle">Sensibilidad calibrada por DPI real</text>
</svg>
