<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ee0979"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent glow circles -->
  <circle cx="200" cy="315" r="200" fill="#ff6a00" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1000" cy="315" r="200" fill="#00c8ff" opacity="0.06" filter="url(#glow)"/>
  <!-- Top line -->
  <rect x="400" y="120" width="400" height="2" fill="url(#fire)" rx="1" opacity="0.6"/>
  <!-- Main title -->
  <text x="600" y="230" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="80" fill="white" text-anchor="middle" letter-spacing="-2">SensiPRO</text>
  <!-- Crosshair icon -->
  <text x="600" y="295" font-family="Arial" font-size="40" text-anchor="middle" fill="#ff6a00">🎯</text>
  <!-- Subtitle -->
  <text x="600" y="350" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="28" fill="#94a3b8" text-anchor="middle">Generador de Sensibilidad #1 para Free Fire 2026</text>
  <!-- Stats bar -->
  <rect x="200" y="400" width="800" height="60" rx="12" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
  <text x="350" y="438" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" fill="#00c8ff" text-anchor="middle">612+ Dispositivos</text>
  <line x1="500" y1="412" x2="500" y2="448" stroke="white" stroke-opacity="0.15"/>
  <text x="600" y="438" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" fill="#ff6a00" text-anchor="middle">21 Marcas</text>
  <line x1="700" y1="412" x2="700" y2="448" stroke="white" stroke-opacity="0.15"/>
  <text x="850" y="438" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" fill="#00c8ff" text-anchor="middle">Motor ARES v5.0</text>
  <!-- Bottom line -->
  <rect x="400" y="500" width="400" height="2" fill="url(#ice)" rx="1" opacity="0.4"/>
  <!-- Tagline -->
  <text x="600" y="550" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="18" fill="#64748b" text-anchor="middle">Calibración por DPI real · 22,000+ valores calibrados</text>
</svg>
