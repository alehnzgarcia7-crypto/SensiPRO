name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: node scripts/ci-runner.mjs ci-logs/lint-npm-ci.log npm ci
      - run: node scripts/ci-runner.mjs ci-logs/lint.log npm run lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-lint
          path: ci-logs/
          if-no-files-found: ignore

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: node scripts/ci-runner.mjs ci-logs/typecheck-npm-ci.log npm ci
      - run: node scripts/ci-runner.mjs ci-logs/typecheck.log npx tsc --noEmit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-typecheck
          path: ci-logs/
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: node scripts/ci-runner.mjs ci-logs/unit-npm-ci.log npm ci
      - run: node scripts/ci-runner.mjs ci-logs/unit-tests.log npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-unit-tests
          path: ci-logs/
          if-no-files-found: ignore

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: node scripts/ci-runner.mjs ci-logs/e2e-npm-ci.log npm ci
      - run: node scripts/ci-runner.mjs ci-logs/playwright-install.log npx playwright install --with-deps chromium
      - run: node scripts/ci-runner.mjs ci-logs/e2e.log npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-e2e
          path: ci-logs/
          if-no-files-found: ignore

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
